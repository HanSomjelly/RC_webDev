    <body>
        <h1>Advanced HTML Notes</h1>
        <h3>lists: </h3>
        <ol type="square"> <!--This is a numbered list-->
            <li>this is the first thing</li>
            <li>this the second</li>
            <li>this comes third</li>
        </ol>
        <ul> <!--this is a bulleted list-->
            <li><a href="https://usapple.org/apple-varieties" target="_blank">apples</a></li>
            <li>banana</li>
            <li>orange</li>
            <li>kiwi</li>
        </ul>
        <dl>
            <dt>fall</dt>
            <dd>halloween</dd>
            <dd>thanksgiving</dd>
            <dt>winter</dt>
            <dd>christmas</dd>
            <dd>hanukkah</dd>
            <dd>new years</dd>
        </dl>

        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTA8Am5zgrJBY-zfvo6GyFT4OLI3Oob_Yyy_8TLStml_w&s=10" alt="Mt timp" width="200px">

        </div>
