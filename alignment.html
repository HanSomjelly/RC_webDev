<!DOCTYPE html>
<html lang="en">
    <head>
        <title>alignment notes</title>
        <meta charset="UTF-8">
        <style>
            button{
                padding: 20px;
                margin: 8px;
                margin-left: 50px;
            }
            #box, #boxtwo{
                width: 75px;
                height: 75px;
                background-color: blue;
                color: azure;
                text-align: center;
                margin: 10 10;
            }
            #box-wrapper{
                display: grid;
                grid-template-columns: 1fr 200px 1fr;
                gap: 5px;
            }
            #flex-wrapper{
                display: flex;
                flex-direction: row;
                justify-content: center;
                align-items: center;
                flex-wrap: wrap;
                margin: 10 10;
            }
            #duck{
                width: 150px;
            }
        </style>
    </head>
    <body>
        <h1>alignment notes</h1>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTySOuL9ArtR6x2RueECbB1BRrGNWyDNmpTQNWl4DskIA&s=10" alt="duck" id="duck" onmouseout="changeImage()">
        <div id="box-wrapper">
            <div id="box" onmouseover="dissapear()" onmouseout="appear()">
                <p>box 1</p>
            </div>
            <div id="boxtwo">
                <p>box 2</p>
            </div>
             <div id="box">
                <p>box 3</p>
            </div>
             <div id="box">
                <p>box 4</p>
            </div>
        </div>
        <div id="flex-wrapper">
            <div id="box">
                <p>box 1</p>
            </div>
            <div id="box">
                <p>box 2</p>
            </div>
             <div id="box">
                <p>box 3</p>
            </div>
             <div id="box">
                <p>box 4</p>
            </div>
        </div>
        <input type="color" id="colorPicker">
        <br>
        <button onClick="color()">Click me</button>
        <button id="showMore" onclick="show()">Show More</button>
        <script>
        // makes webpage interactive
        let images = ["https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS4cyca49k381Dy6YqsMmd0V7OYy5s_OIEDdPn7WMbbrg&s=10", "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTCJw0ymWxuqqNaj-81Z1oFBxF3wTBoWrggKt_Hdo9zPQ&s=10", "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRsNMBp9ranqU6cWu8vziPc_uy-AQGJme1e6iucnpHxcg&s=10", "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTySOuL9ArtR6x2RueECbB1BRrGNWyDNmpTQNWl4DskIA&s=10"]
        let current = 0
        function changeImage(){
            current += 1
            if (current > 3){
                current = 0
            }
            document.getElementById("duck").src = images[current]
        }
        function color(){
            let newColor = document.getElementById("colorPicker").value
            document.getElementById("box").style.backgroundColor = "newColor"
        }
        function dissapear(){
            document.getElementById("boxtwo").style.display = 'none'
        }
        function appear(){
            document.getElementById("boxtwo").style.display = "block"
        }
        function show(){
            let element = document.getElementById("flex-wrapper")
            if (element.style.display == "flex"){
                element.style.display = "none"
                document.getElementById("showMore").innerHTML = "Show More"
            }else{
                element.style.disply = "flex"
                document.getElementById("showMore").innerHTML = "Show More"
            }
        }
    </script>
    </body>
</html>
